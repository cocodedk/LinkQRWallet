name: Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump (patch, minor, major)"
        required: false
        default: "patch"

# Serialize rather than cancel: the next version is derived from the newest tag, so two
# concurrent runs would both read the same one and try to release the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0   # shallow clones hide tags, and the version comes from them

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Compute next version
        id: version
        run: |
          # --sort=-version:refname, because a lexical sort puts v0.9.0 above v0.10.0.
          LATEST=$(git tag --list 'v*' --sort=-version:refname | head -1)
          [ -z "$LATEST" ] && LATEST="v0.0.0"
          VERSION="${LATEST#v}"
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Cannot parse tag: $LATEST"; exit 1; }
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
          BUMP="${{ github.event.inputs.release_type }}"
          [ -z "$BUMP" ] && BUMP="patch"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            *) PATCH=$((PATCH+1)) ;;
          esac
          echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "tag=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Decode and verify keystore
        # Through env, not ${{ }}: interpolation splices the secret's *value* into the
        # shell source, so a password containing $ or a backtick would be expanded
        # before the check ran.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          keytool -list -keystore release.keystore -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PVERSION_NAME=${{ steps.version.outputs.version }}

      - name: Stage the APK under a stable filename
        run: |
          cp app/build/outputs/apk/release/app-release.apk LinkQRWallet.apk
          ls -la LinkQRWallet.apk

      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found in the Android SDK" >&2; exit 1; }
          "$APKSIGNER" verify --print-certs LinkQRWallet.apk

      # This step creates the tag as well as the release. No earlier step pushes to
      # main or creates the tag itself, so there is nothing for branch protection to
      # reject and nothing that can leave a tag behind with no release attached.
      - name: Publish release assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Without this the tag lands on whatever the default branch points at when the
          # API call runs, which is not necessarily the commit whose APK is attached.
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: LinkQRWallet.apk

      - name: Remove keystore from the runner
        if: always()
        run: rm -f release.keystore
