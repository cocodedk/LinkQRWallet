name: Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize rather than cancel: two concurrent runs would read the same version from
# gradle.properties and both try to release it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0   # shallow clones hide tags, and the already-released check needs them

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Read the version
        id: version
        run: |
          # gradle.properties is the only place the version is set; F-Droid's checkupdates
          # reads the same lines at each tag. Refuse to re-release a version, so a
          # forgotten bump fails here instead of overwriting nothing and confusing later.
          # An ordinary push to main is not a bump signal on its own though -- most merges
          # don't touch the version -- so a push run that finds the tag already there just
          # skips the release and stays green; only a manual dispatch treats that as an error.
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Cannot parse VERSION_NAME: '$VERSION'" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::notice::v$VERSION is already released; nothing to do on an ordinary merge."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "v$VERSION is already released. Bump VERSION_NAME and VERSION_CODE in gradle.properties first." >&2
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode and verify keystore
        if: steps.version.outputs.skip != 'true'
        # Through env, not ${{ }}: interpolation splices the secret's *value* into the
        # shell source, so a password containing $ or a backtick would be expanded
        # before the check ran.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          keytool -list -keystore release.keystore -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Build signed release APK
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage the APK under a stable filename
        if: steps.version.outputs.skip != 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk LinkQRWallet.apk
          ls -la LinkQRWallet.apk

      - name: Verify the APK is signed
        if: steps.version.outputs.skip != 'true'
        run: |
          APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found in the Android SDK" >&2; exit 1; }
          "$APKSIGNER" verify --print-certs LinkQRWallet.apk

      # This step creates the tag as well as the release. No earlier step pushes to
      # main or creates the tag itself, so there is nothing for branch protection to
      # reject and nothing that can leave a tag behind with no release attached.
      - name: Publish release assets
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Without this the tag lands on whatever the default branch points at when the
          # API call runs, which is not necessarily the commit whose APK is attached.
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: LinkQRWallet.apk

      - name: Remove keystore from the runner
        if: always()
        run: rm -f release.keystore
